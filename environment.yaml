name: jit
channels:
  - pytorch
  - defaults
  - nvidia
dependencies:
  - python=3.10
  - pip>=25.0
  - numpy=1.22
  - pip:
    - --index-url https://pypi.org/simple
    - --extra-index-url https://download.pytorch.org/whl/cu128
    - torch==2.10.0
    - torchvision==0.25.0
    - opencv-python==4.11.0.86
    - timm==0.9.12
    - tensorboard==2.10.0
    - scipy==1.9.1
    - einops==0.8.1
    - gdown==5.2.0
    - -e ./src/torch-fidelity
